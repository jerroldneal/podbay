<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plugin Editor</title>
<style>
  :root {
    --bg: #0a0a0f; --surface: #12121a; --card: #1a1a2e;
    --border: #2a2a3e; --text: #e0e0e0; --text-muted: #888;
    --accent: #6c5ce7; --accent-hover: #7c6cf7;
    --danger: #e74c3c; --success: #2ecc71;
    --radius: 12px; --font: 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 1.5rem; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
  h1 span { font-size: 2rem; }

  .top-bar { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
  .top-bar select {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-size: .9rem; min-width: 200px;
  }

  .code-editor {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 16px;
  }
  .code-editor textarea {
    width: 100%; min-height: 400px; background: #0d0d14; color: #e0e0e0;
    border: 1px solid var(--border); border-radius: 8px; padding: 16px;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: .9rem; line-height: 1.5; resize: vertical; tab-size: 2;
  }
  .code-editor textarea:focus { outline: none; border-color: var(--accent); }

  .meta-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: .8rem; color: var(--text-muted); }
  .field input {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-size: .9rem;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  .btn {
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
    font-size: .85rem; font-weight: 600; transition: background .2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { background: #27ae60; }
  .btn-danger { background: var(--danger); color: #fff; }

  .actions { display: flex; gap: 8px; }
  .status-bar {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; margin-bottom: 16px; font-size: .85rem; color: var(--text-muted);
  }
  .toast {
    position: fixed; bottom: 24px; right: 24px; padding: 12px 20px;
    background: var(--success); color: #fff; border-radius: 8px; font-weight: 600;
    opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .output {
    background: #0d0d14; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font-family: monospace; font-size: .85rem; max-height: 200px;
    overflow-y: auto; margin-top: 12px; white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="container">
  <h1><span>🔌</span> Plugin Editor</h1>

  <div class="top-bar">
    <select id="podSelect" onchange="onPodSelect()">
      <option value="">Select a pod...</option>
    </select>
    <select id="pluginSelect" onchange="onPluginSelect()" disabled>
      <option value="">Select a plugin...</option>
    </select>
    <button class="btn btn-primary" onclick="newPlugin()">+ New Plugin</button>
    <button class="btn btn-success" onclick="loadPods()">↻ Refresh</button>
  </div>

  <div class="status-bar" id="status">Select a pod and plugin to edit, or create a new plugin.</div>

  <div class="meta-fields">
    <div class="field"><label>Type</label><input id="pType" placeholder="unique-type-name"></div>
    <div class="field"><label>Description</label><input id="pDesc" placeholder="What does this plugin do?"></div>
    <div class="field"><label>Require Path</label><input id="pRequire" placeholder="module-name or path"></div>
    <div class="field"><label>File Path</label><input id="pFile" placeholder="/path/to/script.js"></div>
    <div class="field"><label>Dashboard URL</label><input id="pDashboard" placeholder="http://localhost:3000/dashboard"></div>
  </div>

  <div class="code-editor">
    <textarea id="codeArea" placeholder="// Write your plugin code here...
// This code will be injected into the app's renderer process.
// You have access to window, document, and require().

console.log('[MyPlugin] Hello from plugin!');"></textarea>
  </div>

  <div class="actions">
    <button class="btn btn-success" onclick="savePlugin()">Save to Pod</button>
    <button class="btn btn-primary" onclick="testPlugin()">Test (Execute in Browser)</button>
    <button class="btn btn-danger" onclick="removePlugin()">Remove from Pod</button>
  </div>
  <div id="output" class="output" style="display:none;"></div>
</div>
<div id="toast" class="toast"></div>

<script>
const MCP = 'http://localhost:3098/mcp';
let pods = [];
let currentPodIdx = -1;
let currentPluginIdx = -1;

async function mcpCall(tool, args = {}) {
  const res = await fetch(MCP, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ jsonrpc: '2.0', id: Date.now(), method: 'tools/call', params: { name: 'podbay-' + tool, arguments: args } })
  });
  const j = await res.json();
  if (j.error) throw new Error(j.error.message || JSON.stringify(j.error));
  if (j.result && j.result.content) {
    const txt = j.result.content.find(c => c.type === 'text');
    if (txt) {
      const parsed = JSON.parse(txt.text);
      if (parsed && parsed.error) throw new Error(parsed.error);
      return parsed;
    }
  }
  return null;
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

async function loadPods() {
  pods = await mcpCall('pods_list') || [];
  const sel = document.getElementById('podSelect');
  sel.innerHTML = '<option value="">Select a pod...</option>' +
    pods.map((p, i) => `<option value="${i}">${p.name || p._file} (${(p.plugins||[]).length} plugins)</option>`).join('');
  document.getElementById('pluginSelect').innerHTML = '<option value="">Select a plugin...</option>';
  document.getElementById('pluginSelect').disabled = true;
  currentPodIdx = -1;
  currentPluginIdx = -1;
  clearFields();
}

function onPodSelect() {
  const idx = parseInt(document.getElementById('podSelect').value);
  if (isNaN(idx)) { currentPodIdx = -1; return; }
  currentPodIdx = idx;
  const pod = pods[idx];
  const sel = document.getElementById('pluginSelect');
  sel.disabled = false;
  sel.innerHTML = '<option value="">Select a plugin...</option>' +
    (pod.plugins || []).map((p, i) => `<option value="${i}">${p.type || 'plugin-' + i}</option>`).join('');
  currentPluginIdx = -1;
  clearFields();
  document.getElementById('status').textContent = `Pod: ${pod.name || pod._file} — ${(pod.plugins||[]).length} plugin(s)`;
}

function onPluginSelect() {
  const idx = parseInt(document.getElementById('pluginSelect').value);
  if (isNaN(idx) || currentPodIdx < 0) { currentPluginIdx = -1; return; }
  currentPluginIdx = idx;
  const plugin = pods[currentPodIdx].plugins[idx];
  document.getElementById('pType').value = plugin.type || '';
  document.getElementById('pDesc').value = plugin.description || '';
  document.getElementById('pRequire').value = plugin.require || '';
  document.getElementById('pFile').value = plugin.file || '';
  document.getElementById('pDashboard').value = plugin.dashboard || '';
  document.getElementById('codeArea').value = plugin.code || '';
  document.getElementById('status').textContent = `Editing: ${plugin.type || 'unnamed'} in ${pods[currentPodIdx].name || pods[currentPodIdx]._file}`;
}

function clearFields() {
  ['pType','pDesc','pRequire','pFile','pDashboard'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('codeArea').value = '';
}

function newPlugin() {
  if (currentPodIdx < 0) { toast('Select a pod first'); return; }
  currentPluginIdx = -1;
  clearFields();
  document.getElementById('pluginSelect').value = '';
  document.getElementById('status').textContent = 'Creating new plugin...';
}

function buildPlugin() {
  const p = {};
  const type = document.getElementById('pType').value.trim();
  if (type) p.type = type;
  const desc = document.getElementById('pDesc').value.trim();
  if (desc) p.description = desc;
  const req = document.getElementById('pRequire').value.trim();
  if (req) p.require = req;
  const file = document.getElementById('pFile').value.trim();
  if (file) p.file = file;
  const code = document.getElementById('codeArea').value;
  if (code) p.code = code;
  const dash = document.getElementById('pDashboard').value.trim();
  if (dash) p.dashboard = dash;
  return p;
}

async function savePlugin() {
  if (currentPodIdx < 0) { toast('Select a pod first'); return; }
  const plugin = buildPlugin();
  if (!plugin.type) { toast('Type is required'); return; }

  const pod = JSON.parse(JSON.stringify(pods[currentPodIdx]));
  if (!Array.isArray(pod.plugins)) pod.plugins = [];
  if (currentPluginIdx >= 0) {
    pod.plugins[currentPluginIdx] = plugin;
  } else {
    pod.plugins.push(plugin);
  }

  const savedPodIdx = currentPodIdx;
  const savedFile = pod._file;
  try {
    await mcpCall('pods_save', { filename: pod._file, pod: { name: pod.name, description: pod.description, plugins: pod.plugins } });
  } catch (e) {
    toast('Save failed: ' + e.message);
    document.getElementById('status').textContent = 'Error: ' + e.message;
    return;
  }
  toast('Plugin saved to ' + savedFile);
  await loadPods();
  // re-select the pod we just saved
  document.getElementById('podSelect').value = savedPodIdx;
  onPodSelect();
}

async function removePlugin() {
  if (currentPodIdx < 0 || currentPluginIdx < 0) { toast('Select a plugin first'); return; }
  const pod = JSON.parse(JSON.stringify(pods[currentPodIdx]));
  const savedPodIdx = currentPodIdx;
  pod.plugins.splice(currentPluginIdx, 1);
  try {
    await mcpCall('pods_save', { filename: pod._file, pod: { name: pod.name, description: pod.description, plugins: pod.plugins } });
  } catch (e) {
    toast('Remove failed: ' + e.message);
    document.getElementById('status').textContent = 'Error: ' + e.message;
    return;
  }
  toast('Plugin removed');
  currentPluginIdx = -1;
  clearFields();
  await loadPods();
  document.getElementById('podSelect').value = savedPodIdx;
  onPodSelect();
}

function testPlugin() {
  const code = document.getElementById('codeArea').value;
  if (!code.trim()) { toast('No code to test'); return; }
  const out = document.getElementById('output');
  out.style.display = 'block';
  try {
    const result = new Function(code)();
    out.textContent = 'Result: ' + JSON.stringify(result, null, 2);
  } catch (e) {
    out.textContent = 'Error: ' + e.message;
  }
}

// Tab key support in textarea
document.getElementById('codeArea').addEventListener('keydown', function(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = this.selectionStart;
    this.value = this.value.substring(0, start) + '  ' + this.value.substring(this.selectionEnd);
    this.selectionStart = this.selectionEnd = start + 2;
  }
});

loadPods();
</script>
</body>
</html>
