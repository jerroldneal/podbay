<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PodBay Broker Telemetry</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-base:    #0a0e17;
      --bg-surface: #111827;
      --bg-el:      #1a2236;
      --bg-hover:   #1e293b;
      --accent:     #63b3ed;
      --acc-dim:    rgba(99,179,237,.15);
      --success:    #68d391;
      --suc-dim:    rgba(104,211,145,.15);
      --danger:     #fc8181;
      --dan-dim:    rgba(252,129,129,.15);
      --warning:    #f6ad55;
      --war-dim:    rgba(246,173,85,.15);
      --purple:     #b794f6;
      --pur-dim:    rgba(183,148,246,.15);
      --info:       #76e4f7;
      --inf-dim:    rgba(118,228,247,.15);
      --text1: #e2e8f0;
      --text2: #a0aec0;
      --textm: #4a5568;
      --bdr:   rgba(255,255,255,.06);
      --r:     8px;
      --overlay: rgba(10,14,23,.92);
      --scrollbar: rgba(255,255,255,.12);
      --scrollbar-hover: rgba(255,255,255,.22);
    }
    [data-theme="light"] {
      --bg-base:    #f0f4f8;
      --bg-surface: #ffffff;
      --bg-el:      #e2e8f0;
      --bg-hover:   #cbd5e0;
      --accent:     #2b6cb0;
      --acc-dim:    rgba(43,108,176,.12);
      --success:    #276749;
      --suc-dim:    rgba(39,103,73,.12);
      --danger:     #c53030;
      --dan-dim:    rgba(197,48,48,.10);
      --warning:    #c05621;
      --war-dim:    rgba(192,86,33,.10);
      --purple:     #553c9a;
      --pur-dim:    rgba(85,60,154,.10);
      --info:       #0987a0;
      --inf-dim:    rgba(9,135,160,.10);
      --text1: #1a202c;
      --text2: #2d3748;
      --textm: #718096;
      --bdr:   rgba(0,0,0,.10);
      --overlay: rgba(240,244,248,.92);
      --scrollbar: rgba(0,0,0,.15);
      --scrollbar-hover: rgba(0,0,0,.28);
    }
    body {
      font-family: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      font-size: 12px; background: var(--bg-base); color: var(--text1);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── top bar ── */
    .top-bar {
      height: 48px; background: var(--bg-surface); border-bottom: 1px solid var(--bdr);
      display: flex; align-items: center; padding: 0 16px; gap: 12px; flex-shrink: 0;
    }
    .brand { font-size: 14px; font-weight: 700; white-space: nowrap; }
    .brand span { color: var(--accent); }
    .stats { display: flex; gap: 6px; margin-left: 12px; }
    .stat-pill {
      background: var(--bg-el); border: 1px solid var(--bdr);
      border-radius: 20px; padding: 2px 10px; font-size: 11px;
    }
    .stat-pill .n { font-weight: 700; margin-right: 3px; }
    .stat-pill.s-total     .n { color: var(--accent); }
    .stat-pill.s-connected .n { color: var(--success); }
    .stat-pill.s-calls     .n { color: var(--warning); }
    .stat-pill.s-errors    .n { color: var(--danger); }
    .spacer { flex: 1; }
    .src-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); }
    .src-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--textm); }
    .src-dot.ok      { background: var(--success); box-shadow: 0 0 5px var(--success); }
    .src-dot.missing { background: var(--danger); animation: pulse 1.2s infinite; }
    .btn {
      background: var(--bg-el); border: 1px solid var(--bdr); border-radius: 6px;
      color: var(--text2); padding: 4px 10px; font-size: 11px; cursor: pointer;
      transition: background 120ms, color 120ms, border-color 120ms;
    }
    .btn:hover { background: var(--bg-hover); color: var(--text1); }
    .btn.danger:hover { background: var(--dan-dim); color: var(--danger); border-color: var(--danger); }
    .btn.active { background: var(--war-dim); color: var(--warning); border-color: var(--warning); }

    /* ── main split ── */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ── left: instances ── */
    .panel-instances {
      width: 290px; min-width: 200px; flex-shrink: 0;
      background: var(--bg-surface); border-right: 1px solid var(--bdr);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-header {
      padding: 10px 12px 8px; border-bottom: 1px solid var(--bdr);
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .5px; color: var(--text2); flex-shrink: 0;
    }
    .instance-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }

    .instance-card {
      background: var(--bg-el); border: 1px solid var(--bdr);
      border-radius: var(--r); padding: 10px 12px;
      cursor: pointer; transition: border-color 120ms, background 120ms;
    }
    .instance-card:hover { background: var(--bg-hover); }
    .instance-card.selected { border-color: var(--accent); }
    .instance-card.selected.is-connected { border-color: var(--success); background: rgba(104,211,145,.06); }

    .ic-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.connected    { background: var(--success); box-shadow: 0 0 5px var(--success); }
    .status-dot.disconnected { background: var(--danger); }
    .status-dot.reconnecting { background: var(--warning); animation: pulse 1s infinite; }
    .ic-id { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }

    .ic-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
    .badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 500; }
    .badge.tools      { background: var(--acc-dim); color: var(--accent); }
    .badge.registered { background: var(--suc-dim); color: var(--success); }
    .badge.reconnect  { background: var(--war-dim); color: var(--warning); font-size: 9px; }

    .ic-tools { font-size: 10px; color: var(--textm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 4px; }
    .ic-actions { display: flex; gap: 4px; margin-top: 7px; }
    .ic-actions .btn { flex: 1; text-align: center; padding: 3px 0; font-size: 10px; }

    .empty-state { text-align: center; padding: 48px 20px; color: var(--textm); }
    .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
    .empty-state p { font-size: 12px; line-height: 1.7; }

    /* ── right: log ── */
    .panel-right { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .log-toolbar {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      background: var(--bg-surface); border-bottom: 1px solid var(--bdr); flex-shrink: 0;
    }
    .log-toolbar label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; color: var(--text2); white-space: nowrap; }
    .filter-input {
      flex: 1; max-width: 300px; background: var(--bg-el); border: 1px solid var(--bdr);
      border-radius: 6px; color: var(--text1); font-size: 11px; padding: 4px 10px; outline: none;
    }
    .filter-input:focus { border-color: var(--accent); }
    .filter-input::placeholder { color: var(--textm); }
    .chk-label { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text2); cursor: pointer; white-space: nowrap; }
    .log-count { font-size: 11px; color: var(--textm); }

    .log-body { flex: 1; overflow-y: auto; font-family: 'Consolas','JetBrains Mono','Fira Code',monospace; font-size: 11px; }
    .log-row {
      display: grid; grid-template-columns: 88px 160px 132px 1fr 16px;
      gap: 0 8px; padding: 3px 12px; border-bottom: 1px solid rgba(255,255,255,.02);
      align-items: baseline; transition: background 60ms; cursor: pointer;
    }
    .log-row:hover { background: var(--bg-el); }
    .log-row.is-error { background: rgba(252,129,129,.04); }
    .log-row.expanded { background: var(--bg-el); align-items: start; }
    .log-chevron { color: var(--textm); font-size: 9px; line-height: 1.8; user-select: none; text-align: center; }
    .log-expand {
      grid-column: 1 / -1; padding: 8px 10px 10px; margin: 2px 0 4px;
      background: var(--bg-hover); border-radius: 4px; overflow-x: auto;
    }
    .log-expand pre {
      font-family: 'Consolas','JetBrains Mono','Fira Code',monospace;
      font-size: 11px; line-height: 1.6; margin: 0;
      white-space: pre-wrap; word-break: break-word; color: var(--text1);
    }
    .jk { color: var(--accent); }
    .js { color: var(--info); }
    .jn { color: var(--warning); }
    .jb { color: var(--purple); }
    .jnull { color: var(--danger); font-style: italic; }
    .log-ts { color: var(--textm); font-size: 10px; }
    .log-client { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text2); font-size: 10px; }
    .ev-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; letter-spacing: .3px; }
    .ev-purple  { background: var(--pur-dim); color: var(--purple); }
    .ev-accent  { background: var(--acc-dim); color: var(--accent); }
    .ev-success { background: var(--suc-dim); color: var(--success); }
    .ev-info    { background: var(--inf-dim); color: var(--info); }
    .ev-warning { background: var(--war-dim); color: var(--warning); }
    .ev-danger  { background: var(--dan-dim); color: var(--danger); }
    .ev-muted   { background: rgba(255,255,255,.04); color: var(--text2); }
    .ev-result-ok  { background: var(--suc-dim); color: var(--success); }
    .ev-result-err { background: var(--dan-dim); color: var(--danger); }
    .log-detail { color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; }
    .log-detail .hi  { color: var(--text1); }
    .log-detail .ok  { color: var(--success); }
    .log-detail .err { color: var(--danger); }
    .log-detail .ms  { color: var(--textm); }

    /* ── no-source gate ── */
    .no-source {
      position: fixed; inset: 0; background: var(--overlay);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; z-index: 1000;
    }
    .no-source.hidden { display: none; }
    .no-source .ns-title { font-size: 16px; font-weight: 700; }
    .no-source .ns-sub { font-size: 12px; color: var(--text2); text-align: center; max-width: 420px; line-height: 1.7; }
    .ns-spin { width: 32px; height: 32px; border: 3px solid var(--bg-el); border-top-color: var(--accent); border-radius: 50%; }

    /* ── scrollbars ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    @keyframes spin   { to { transform: rotate(360deg); } }
  </style>
  <script>(function(){var t=localStorage.getItem('broker-dash-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<!-- no-source gate -->
<div class="no-source" id="no-source">
  <div class="ns-spin" style="animation: spin .8s linear infinite"></div>
  <div class="ns-title">Searching for telemetry source…</div>
  <div class="ns-sub">
    Open this dashboard from a PodBay-injected game page (via <code>broker-dashboard.js</code> plugin),
    or ensure <code>broker-client.js</code> has been injected into the current window context.
  </div>
</div>

<!-- top bar -->
<div class="top-bar">
  <div class="brand">PodBay <span>Broker Telemetry</span></div>
  <div class="stats">
    <div class="stat-pill s-total">    <span class="n" id="s-total">0</span> instances</div>
    <div class="stat-pill s-connected"><span class="n" id="s-conn">0</span> connected</div>
    <div class="stat-pill s-calls">    <span class="n" id="s-calls">0</span> calls</div>
    <div class="stat-pill s-errors">   <span class="n" id="s-errors">0</span> errors</div>
  </div>
  <div class="spacer"></div>
  <div class="src-badge">
    <div class="src-dot" id="src-dot"></div>
    <span id="src-label">no source</span>
  </div>
  <button class="btn" id="btn-theme" aria-label="Toggle light/dark theme">☀ Theme</button>
  <button class="btn active" id="btn-pause">Pause</button>
  <button class="btn danger" id="btn-clear">Clear History</button>
</div>

<div class="main">

  <!-- left: instance list -->
  <div class="panel-instances">
    <div class="panel-header">Instances</div>
    <div class="instance-list" id="inst-list"></div>
  </div>

  <!-- right: event log -->
  <div class="panel-right">
    <div class="log-toolbar">
      <label>Event Log</label>
      <input class="filter-input" id="log-filter" placeholder="Filter by clientId, event, or detail…" aria-label="Filter events by clientId, event type, or detail">
      <label class="chk-label">
        <input type="checkbox" id="chk-auto" checked> Auto-scroll
      </label>
      <div class="spacer"></div>
      <span class="log-count" id="log-count" aria-live="polite" aria-atomic="true">0 events</span>
    </div>
    <div class="log-body" id="log-body"></div>
  </div>

</div>

<script>
;(function () {
  'use strict';

  // ── Theme toggle ─────────────────────────────────────────────────────
  var elBtnTheme = document.getElementById('btn-theme');
  (function initTheme() {
    var theme = localStorage.getItem('broker-dash-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', theme);
    elBtnTheme.textContent = theme === 'light' ? '🌙 Theme' : '☀ Theme';
  })();
  elBtnTheme.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('broker-dash-theme', next);
    elBtnTheme.textContent = next === 'light' ? '🌙 Theme' : '☀ Theme';
  });

  // ── Source detection ─────────────────────────────────────────────────
  // Works as: inline page | srcdoc iframe (parent) | about:blank popup (opener)
  function getSource() {
    try { if (window.PodBayBrokerTelemetry) return window.PodBayBrokerTelemetry; } catch (_) {}
    try { if (window.parent !== window && window.parent.PodBayBrokerTelemetry) return window.parent.PodBayBrokerTelemetry; } catch (_) {}
    try { if (window.opener && window.opener.PodBayBrokerTelemetry) return window.opener.PodBayBrokerTelemetry; } catch (_) {}
    return null;
  }

  // ── Event type registry ───────────────────────────────────────────────
  var EV_META = {
    constructed:         { cls: 'ev-purple',     label: 'constructed' },
    reused:              { cls: 'ev-accent',     label: 'reused' },
    connected:           { cls: 'ev-success',    label: 'connected' },
    registered:          { cls: 'ev-info',       label: 'registered' },
    server_ack:          { cls: 'ev-success',    label: 'server_ack' },
    tool_upserted:       { cls: 'ev-accent',     label: 'tool_upserted' },
    tool_called:         { cls: 'ev-warning',    label: 'tool_called' },
    tool_result:         { cls: 'ev-result-ok',  label: 'tool_result' },
    disconnected:        { cls: 'ev-danger',     label: 'disconnected' },
    reconnect_scheduled: { cls: 'ev-muted',      label: 'reconnect_sched' }
  };

  function evMeta(event, detail) {
    var base = EV_META[event] || { cls: 'ev-muted', label: event };
    // Clone so we don't mutate the registry
    var m = { cls: base.cls, label: base.label };
    if (event === 'tool_result' && detail && detail.isError)          m.cls = 'ev-result-err';
    if (event === 'disconnected' && detail && !detail.reconnecting)   m.cls = 'ev-danger';
    if (event === 'disconnected' && detail &&  detail.reconnecting)   m.cls = 'ev-warning';
    return m;
  }

  // ── Detail formatter ─────────────────────────────────────────────────
  function fmtDetail(event, d) {
    if (!d) return '';
    switch (event) {
      case 'constructed':
        return '<span class="hi">' + (d.tools && d.tools.length ? esc(d.tools.join(', ')) : 'no tools') + '</span>';
      case 'reused':
        return 'upserted: <span class="hi">' + esc((d.upserted || []).join(', ') || 'none') + '</span>';
      case 'registered':
        return '<span class="hi">' + d.toolCount + '</span> tools sent to broker';
      case 'tool_upserted':
        return '<span class="hi">' + esc(d.name || '') + '</span> '
          + (d.replaced ? '<span class="ok">replaced</span>' : '<span class="hi">added</span>');
      case 'tool_called':
        return 'tool: <span class="hi">' + esc(d.tool || '') + '</span>';
      case 'tool_result': {
        var dur = d.durationMs != null ? ' <span class="ms">(' + d.durationMs + 'ms)</span>' : '';
        return 'tool: <span class="hi">' + esc(d.tool || '') + '</span>'
          + (d.isError ? ' <span class="err">error</span>' : ' <span class="ok">ok</span>') + dur;
      }
      case 'disconnected':
        return d.reconnecting
          ? '<span class="ok">will reconnect</span>'
          : '<span class="err">permanently disconnected</span>';
      case 'reconnect_scheduled':
        return 'delay: <span class="hi">' + (d.delayMs || 0) + 'ms</span>';
      default: {
        var keys = Object.keys(d).slice(0, 3);
        return keys.map(function (k) {
          return '<span class="ms">' + esc(k) + ':</span> <span class="hi">' + esc(JSON.stringify(d[k])) + '</span>';
        }).join(' ');
      }
    }
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function prettyJson(val, indent) {
    indent = indent || 0;
    var pad  = new Array(indent + 1).join('  ');
    var pad1 = new Array(indent + 2).join('  ');
    if (val === null)            return '<span class="jnull">null</span>';
    if (typeof val === 'boolean') return '<span class="jb">' + val + '</span>';
    if (typeof val === 'number')  return '<span class="jn">' + val + '</span>';
    if (typeof val === 'string')  return '<span class="js">"' + esc(val) + '"</span>';
    if (Array.isArray(val)) {
      if (!val.length) return '[]';
      return '[\n' + val.map(function (v) { return pad1 + prettyJson(v, indent + 1); }).join(',\n') + '\n' + pad + ']';
    }
    if (typeof val === 'object') {
      var keys = Object.keys(val);
      if (!keys.length) return '{}';
      return '{\n' + keys.map(function (k) {
        return pad1 + '<span class="jk">"' + esc(k) + '"</span>: ' + prettyJson(val[k], indent + 1);
      }).join(',\n') + '\n' + pad + '}';
    }
    return esc(String(val));
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    return p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()) + '.' + p3(d.getMilliseconds());
  }
  function p(n)  { return n < 10 ? '0' + n : '' + n; }
  function p3(n) { return n < 10 ? '00' + n : n < 100 ? '0' + n : '' + n; }

  // ── State ────────────────────────────────────────────────────────────
  var sel    = null;   // selected clientId
  var paused = false;

  // Change-detection fingerprints
  var _instSig  = '';
  var _logLen   = -1;
  var _logFilter = '';
  var _logSel   = null;

  // Expanded log rows (key → true)
  var _expandedKeys = {};

  // ── DOM refs ──────────────────────────────────────────────────────────
  var elNoSource  = document.getElementById('no-source');
  var elSrcDot    = document.getElementById('src-dot');
  var elSrcLabel  = document.getElementById('src-label');
  var elInstList  = document.getElementById('inst-list');
  var elLogBody   = document.getElementById('log-body');
  var elFilter    = document.getElementById('log-filter');
  var elChkAuto   = document.getElementById('chk-auto');
  var elBtnPause  = document.getElementById('btn-pause');
  var elBtnClear  = document.getElementById('btn-clear');
  var elSTotal    = document.getElementById('s-total');
  var elSConn     = document.getElementById('s-conn');
  var elSCalls    = document.getElementById('s-calls');
  var elSErrors   = document.getElementById('s-errors');
  var elLogCount  = document.getElementById('log-count');

  // ── Controls ──────────────────────────────────────────────────────────
  elBtnPause.addEventListener('click', function () {
    paused = !paused;
    elBtnPause.textContent = paused ? 'Resume' : 'Pause';
    elBtnPause.classList.toggle('active', paused);
  });

  elBtnClear.addEventListener('click', function () {
    if (!confirm('Clear all event history? This cannot be undone.')) return;
    var src = getSource();
    if (src && src.clearHistory) { src.clearHistory(); _logLen = -1; }
  });

  // ── Persistent preferences ───────────────────────────────────────────
  var savedAutoScroll = localStorage.getItem('broker-dash-autoscroll');
  if (savedAutoScroll !== null) elChkAuto.checked = savedAutoScroll === '1';
  elChkAuto.addEventListener('change', function () {
    localStorage.setItem('broker-dash-autoscroll', elChkAuto.checked ? '1' : '0');
  });

  elFilter.addEventListener('input', function () {
    _logFilter = '';  // force re-render
    renderLog(getSource());
  });

  // ── Render cycle ─────────────────────────────────────────────────────
  function render() {
    if (paused) return;
    var src = getSource();
    if (!src) {
      elNoSource.classList.remove('hidden');
      elSrcDot.className = 'src-dot missing';
      elSrcLabel.textContent = 'no telemetry source';
      return;
    }
    elNoSource.classList.add('hidden');
    elSrcDot.className = 'src-dot ok';
    var ids = Object.keys(src.instances);
    elSrcLabel.textContent = ids.length + ' instance' + (ids.length !== 1 ? 's' : '') + ' live';

    renderStats(src);
    renderInstances(src);
    renderLog(src);
  }

  function renderStats(src) {
    var ids = Object.keys(src.instances);
    var conn = 0, calls = 0, errs = 0;
    ids.forEach(function (id) { if (src.instances[id].connected) conn++; });
    src.history.forEach(function (e) {
      if (e.event === 'tool_called') calls++;
      if (e.event === 'tool_result' && e.detail && e.detail.isError) errs++;
    });
    elSTotal.textContent  = ids.length;
    elSConn.textContent   = conn;
    elSCalls.textContent  = calls;
    elSErrors.textContent = errs;
  }

  function renderInstances(src) {
    var insts = src.instances;
    var ids = Object.keys(insts);

    // Cheap fingerprint for change detection
    var sig = sel + '|' + ids.map(function (id) {
      var c = insts[id];
      return id + (c.connected ? 'C' : 'D') + (c.registered ? 'R' : '') + c.tools.length;
    }).join('|');
    if (_instSig === sig) return;
    _instSig = sig;

    if (!ids.length) {
      elInstList.innerHTML = '<div class="empty-state"><div class="icon">📡</div>'
        + '<p>No broker clients constructed yet.<br>Inject a pod containing <code>broker-client.js</code>.</p></div>';
      return;
    }

    var html = ids.map(function (id) {
      var c = insts[id];
      var dotCls = c.connected ? 'connected' : (c.reconnectDelay > 3000 ? 'reconnecting' : 'disconnected');
      var connCls = c.connected ? ' is-connected' : '';
      var selCls  = (sel === id) ? ' selected' : '';
      var regBadge     = c.registered ? '<span class="badge registered">registered</span>' : '';
      var reconBadge   = (!c.connected && c.reconnectDelay > 3000) ? '<span class="badge reconnect">reconnecting…</span>' : '';
      var actionBtn    = c.connected
        ? '<button class="btn danger ic-btn" data-a="disconnect" data-id="' + esc(id) + '">Disconnect</button>'
        : '<button class="btn ic-btn" data-a="reconnect" data-id="' + esc(id) + '">Reconnect</button>';
      var toolNames = c.tools.length ? '<div class="ic-tools">' + esc(c.tools.join(', ')) + '</div>' : '';
      return '<div class="instance-card' + selCls + connCls + '" data-id="' + esc(id) + '" role="button" tabindex="0" aria-label="Instance ' + esc(id) + '">'
        + '<div class="ic-head"><div class="status-dot ' + dotCls + '"></div>'
        + '<div class="ic-id" title="' + esc(id) + '">' + esc(id) + '</div></div>'
        + '<div class="ic-badges"><span class="badge tools">' + c.tools.length + ' tools</span>' + regBadge + reconBadge + '</div>'
        + toolNames
        + '<div class="ic-actions">' + actionBtn + '</div>'
        + '</div>';
    }).join('');

    elInstList.innerHTML = html;

    // Selection
    elInstList.querySelectorAll('.instance-card').forEach(function (card) {
      card.addEventListener('click', function (e) {
        if (e.target.classList.contains('ic-btn')) return;
        sel = (card.dataset.id === sel) ? null : card.dataset.id;
        _instSig = '';
        _logSel = null;
        render();
      });
      card.addEventListener('keydown', function (e) {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        if (e.target !== card) return;
        e.preventDefault();
        sel = (card.dataset.id === sel) ? null : card.dataset.id;
        _instSig = '';
        _logSel = null;
        render();
      });
    });
    // Actions
    elInstList.querySelectorAll('.ic-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var src2 = getSource();
        if (!src2) return;
        if (btn.dataset.a === 'disconnect' && src2.disconnect) src2.disconnect(btn.dataset.id);
        if (btn.dataset.a === 'reconnect'  && src2.reconnect)  src2.reconnect(btn.dataset.id);
      });
    });
  }

  function renderLog(src) {
    if (!src) return;
    var filter = elFilter.value.toLowerCase();
    var hist   = src.history;
    var dirty  = hist.length !== _logLen || filter !== _logFilter || sel !== _logSel;
    if (!dirty) return;
    _logLen    = hist.length;
    _logFilter = filter;
    _logSel    = sel;

    var rows = hist.filter(function (e) {
      if (sel && e.clientId !== sel) return false;
      if (!filter) return true;
      var ds = JSON.stringify(e.detail || '').toLowerCase();
      return e.clientId.toLowerCase().includes(filter)
          || e.event.toLowerCase().includes(filter)
          || ds.includes(filter);
    });

    elLogCount.textContent = rows.length + (rows.length !== hist.length ? '/' + hist.length : '') + ' events';

    var wasAtBottom = elLogBody.scrollHeight - elLogBody.scrollTop <= elLogBody.clientHeight + 40;

    elLogBody.innerHTML = rows.map(function (e) {
      var m         = evMeta(e.event, e.detail);
      var isErr     = (e.event === 'tool_result' && e.detail && e.detail.isError);
      var key       = e.ts + '|' + e.clientId + '|' + e.event;
      var isExp     = !!_expandedKeys[key];
      var hasDetail = !!e.detail;
      var expandBlock = (isExp && hasDetail)
        ? '<div class="log-expand"><pre>' + prettyJson(e.detail) + '</pre></div>' : '';
      return '<div class="log-row' + (isErr ? ' is-error' : '') + (isExp ? ' expanded' : '') + '" data-key="' + esc(key) + '">'
        + '<div class="log-ts">'     + fmtTime(e.ts) + '</div>'
        + '<div class="log-client" title="' + esc(e.clientId) + '">' + esc(e.clientId) + '</div>'
        + '<div><span class="ev-badge ' + m.cls + '">' + m.label + '</span></div>'
        + '<div class="log-detail">' + fmtDetail(e.event, e.detail) + '</div>'
        + '<div class="log-chevron">' + (hasDetail ? (isExp ? '&#9660;' : '&#9654;') : '') + '</div>'
        + expandBlock
        + '</div>';
    }).join('');

    elLogBody.querySelectorAll('.log-row[data-key]').forEach(function (row) {
      row.addEventListener('click', function () {
        var k = row.dataset.key;
        if (_expandedKeys[k]) delete _expandedKeys[k];
        else _expandedKeys[k] = true;
        _logLen = -1;
        renderLog(getSource());
      });
    });

    if (elChkAuto.checked && (wasAtBottom || _logLen <= 10)) {
      elLogBody.scrollTop = elLogBody.scrollHeight;
    }
  }

  // ── Poll ─────────────────────────────────────────────────────────────
  setInterval(render, 500);
  render();

})();
</script>
</body>
</html>
