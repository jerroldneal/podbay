services:
  podbay:
    build: .
    container_name: podbay
    restart: unless-stopped
    environment:
      - PODBAY_BROKER_URL=ws://host.docker.internal:3099
      - PODBAY_SEARCH_ROOTS=/host/programs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${LOCALAPPDATA}/Programs:/host/programs:rw"
      - ./reverse-client.js:/app/reverse-client.js:rw
      - ./index.js:/app/index.js:rw
      - ./lib:/app/lib:rw
      - ./.opted-in.json:/app/.opted-in.json:rw
      - ./pods:/app/pods:rw
      - ./plugins:/app/plugins:rw
    network_mode: bridge

  dashboard:
    image: nginx:alpine
    container_name: podbay-dashboard
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard.html:/usr/share/nginx/html/index.html:ro
      - ./console.html:/usr/share/nginx/html/console.html:ro
